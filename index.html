<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style/base.css" />
    <link rel="stylesheet" href="style/ulti.css" />
    <link rel="stylesheet" href="style/styling.css" />
    <title>World Cup Tickets</title>
  </head>
  <body>
    <header>
      <div class="header-title">
        <div class="logo">26</div>
        <div class="title">WORLD CUP TICKETS</div>
      </div>
      <nav>
        <ul class="nav-bar">
          <li class="link"><a href="#matches">matches</a></li>
          <li class="link"><a href="#matches">teams</a></li>
          <li class="link"><a href="#matches">venues</a></li>
          <li class="link"><a href="#how">how it work</a></li>
        </ul>
        <button>Sign in</button>
      </nav>
    </header>
    <main>
      <section class="hero">
        <div class="event-bar">
          <ul class="event-list">
            <div class="calendar"><div class="date">JUNE-JULY 2026</div></div>

            <li class="host">USA</li>
            <li class="host">CANADA</li>
            <li class="host">MEXICO</li>
          </ul>
        </div>
        <div class="hero-container">
          <h class="main-headline">OWN THE</h>
          <div class="head-content">
            <h1 class="headline-content-1">
              BIGGEST<span class="headline-content">MATCHES</span>
            </h1>
          </div>
        </div>
        <p class="paragraph">
          lock in your seats for the world cup . real tickets , real teams , no
          resale markup
        </p>
        <div class="hero-buttons">
          <button class="btn-browse">Browse matches →</button>
          <button class="btn-view">Views venues</button>
        </div>
      </section>
    </main>
